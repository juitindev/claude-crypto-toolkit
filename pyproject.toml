[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-crypto-toolkit"
version = "0.1.0"
description = "A reference implementation of Anthropic Claude's advanced API patterns (Tool Use, Prompt Caching, Streaming, Scope Enforcement) using public crypto market data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Jui Ting Chang", email = "ruitingz987@gmail.com" },
]
keywords = ["anthropic", "claude", "tool-use", "prompt-caching", "streaming", "crypto"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.9.0",
    "typer>=0.12.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
crypto-toolkit = "crypto_toolkit.cli:app"

[project.urls]
Homepage = "https://github.com/juitindev/claude-crypto-toolkit"
Repository = "https://github.com/juitindev/claude-crypto-toolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crypto_toolkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that hit the live Anthropic API (require ANTHROPIC_API_KEY)",
]
addopts = "-ra -q --strict-markers -m 'not live'"

[tool.mypy]
python_version = "3.11"
strict = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = true
exclude = ["tests/", "examples/"]
